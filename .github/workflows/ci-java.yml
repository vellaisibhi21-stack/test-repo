# ── LaneSync-managed workflow ─────────────────────────────────────────────
# This file is owned by LaneSync. Future "Update workflows" PRs may replace
# custom edits you make here. Review the PR diff before merging.
name: "CI — Build & Test"

# Working Java (Maven) CI — generated by LaneSync.
# Runs mvn verify (Surefire + JaCoCo), collects HTML reports, uploads evidence to LaneSync.

on:
  pull_request:
    branches: [ "main", "release/*" ]
  push:
    branches: [ "main", "release/*" ]
  release:
    types: [published]

jobs:
  build:
    name: "CI — Build & Test"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run unit tests
        run: |
          if [ -f pom.xml ]; then
            mvn -B test || TEST_EXIT=$?
            mkdir -p coverage
            if [ -d target/site/jacoco ]; then cp -r target/site/jacoco/* coverage/ 2>/dev/null || true; fi
            echo "<html><body><h1>Unit Tests (Surefire)</h1><pre>$(cat target/surefire-reports/*.txt 2>/dev/null | head -200 || echo 'no surefire reports')</pre></body></html>" > unit-tests.html
          else
            echo "No pom.xml found — skipping Maven build. Add a pom.xml to get started."
          fi
          [ -f unit-tests.html ] || echo "<html><body><h1>Unit Tests</h1><p>No tests yet — add a pom.xml and test suite to get started.</p></body></html>" > unit-tests.html
          mkdir -p coverage
          [ -f coverage/index.html ] || echo "<html><body><h1>Coverage</h1></body></html>" > coverage/index.html
          echo "<html><body><h1>Integration Tests</h1><p>Configure Failsafe integration tests here.</p></body></html>" > integration-tests.html
          exit ${TEST_EXIT:-0}

      # ── Integration tests (uncomment and adapt) ──
      # - name: Run integration tests
      #   run: |
      #     mvn -B verify -DskipUnitTests=true
      #     echo "<html><body><h1>Integration Tests</h1><pre>$(cat target/failsafe-reports/*.txt 2>/dev/null | head -200)</pre></body></html>" > integration-tests.html

      - name: SAST scan (OpenGrep)
        if: always()
        env:
          OPENGREP_VERSION: v1.22.0
          OPENGREP_INSTALL_SHA: f458d7f0d52cc58eae1ca3cf3d5caf101e637519
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_INSTALL_SHA}/install.sh" \
            | bash -s -- -v "$OPENGREP_VERSION" || true
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          # Scan source only: generated reports and build output are not the customer's code.
          opengrep scan --config auto --exclude .github --exclude coverage --exclude unit-tests.html \
            --exclude integration-tests.html --exclude target \
            --sarif -o sast.sarif . 2>/dev/null || true

      - name: CVE scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW
          # Build output holds tool jars (JaCoCo agent, plugins), not the app's dependencies.
          skip-dirs: target

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ github.sha }}
          path: |
            unit-tests.html
            integration-tests.html
            sast.sarif
            trivy.json
            target/surefire-reports/
            target/site/jacoco/jacoco.xml
            coverage/
          retention-days: 30

      - name: Upload evidence to LaneSync
        uses: ./.github/actions/lanesync-upload
        if: always()
        with:
          api-url: ${{ vars.SDLC_API_URL || 'https://lanesync.dev' }}
          api-key: ${{ secrets.LANESYNC_API_KEY }}
          dev-branch: "main"
          release-prefix: "release/"
          pipeline: "CI — Build & Test"

  tag:
    name: Auto-Tag on Push
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate and Push Tag
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            NEW_TAG="dev-${SHA_SHORT}"
          elif [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION=${BRANCH_NAME#release/}
            NEW_TAG="${VERSION}-rc-${SHA_SHORT}"
          else
            echo "Branch not targeted for auto-tagging."; exit 0
          fi
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $NEW_TAG"
            exit 0
          fi
          git tag "$NEW_TAG"
          if git push origin "$NEW_TAG"; then
            echo "Pushed tag: $NEW_TAG"
          else
            echo "GITHUB_TOKEN could not push ${NEW_TAG}. LaneSync creates it with the app installation token."
          fi
